name: Publish MemoryBridge Hub
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Refresh dementia resources]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python -m unittest discover -s tests
      - run: node --check app.js
      - run: python -m py_compile scripts/crawl.py
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/memorybridge-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/ > /dev/null && break; sleep 1; done
          python tests/browser_smoke.py
      - uses: actions/configure-pages@v5
      - run: mkdir public; cp index.html es.html style.css app.js public/; cp -r data public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
