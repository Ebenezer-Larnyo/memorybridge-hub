name: Refresh dementia resources
on:
  workflow_dispatch:
  # Enable weekly schedule after confirming source policies and adding project contact.
  # schedule:
  #   - cron: '23 15 * * 1'
permissions:
  contents: write
concurrency:
  group: dementia-crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/crawl.py
      - run: python -m unittest discover -s tests
      - run: |
          git config user.name 'MemoryBridge Hub bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resources.json data/crawl-report.json
          git diff --cached --quiet || git commit -m 'Refresh dementia resources'
          git push
