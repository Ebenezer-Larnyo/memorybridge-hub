name: Validate Naviboa frontend
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/quality.py --write
      - run: python -m unittest discover -s tests
      - run: python scripts/quality.py --check
      - run: node --check app.js && node --check admin/review.js && node --check ai-worker/index.mjs && node tests/worker.test.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate private admin build and JWT access-control tests
        run: |
          npm install --prefix private-admin --no-audit --no-fund
          npm run check --prefix private-admin
          cd private-admin
          npx wrangler deploy --dry-run --outdir=.wrangler-preview
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/naviboa-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/ > /dev/null && break; sleep 1; done
          python tests/browser_smoke.py
          python tests/voice_test.py
          python tests/reviewer_smoke.py
